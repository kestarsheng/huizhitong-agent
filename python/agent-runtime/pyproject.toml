[project]
name = "huizhitong-agent-runtime"
version = "0.1.0"
description = "汇智通智能体运行时"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "sse-starlette>=2.1,<3.0",
]

[project.optional-dependencies]
ai = [
  "langchain>=0.3,<1.0",
  "langgraph>=0.2,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

