# 汇智通部署覆盖文件：复用宿主机已运行的 MySQL（省去拉取 mysql:8.0 镜像）
# 适用场景：本地已有 MySQL / 国内网络拉不动 mysql:8.0
# 用法：
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.host.yml up -d
# 说明：宿主机 MySQL 需已建 huizhitong 库（root 密码通过 .env 的 MYSQL_HOST_PASSWORD 配置，默认 henu）

name: huizhitong

services:
  # 容器版 MySQL 仅挂在 host-mysql profile 下：不带 --profile 启动时自动跳过
  mysql:
    profiles: ["host-mysql"]

  tool-service:
    depends_on: !reset []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_HOST_PASSWORD:-henu}
      MYSQL_DATABASE: huizhitong

  agent-runtime:
    depends_on: !reset []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TICKET_MYSQL_HOST: host.docker.internal
      TICKET_MYSQL_PORT: "3306"
      TICKET_MYSQL_USER: root
      TICKET_MYSQL_PASSWORD: ${MYSQL_HOST_PASSWORD:-henu}
      TICKET_MYSQL_DATABASE: huizhitong

  audit-worker:
    depends_on: !reset []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TICKET_MYSQL_HOST: host.docker.internal
      TICKET_MYSQL_PORT: "3306"
      TICKET_MYSQL_USER: root
      TICKET_MYSQL_PASSWORD: ${MYSQL_HOST_PASSWORD:-henu}
      TICKET_MYSQL_DATABASE: huizhitong