server:
  port: 8083

spring:
  application:
    name: huizhitong-tool-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:huizhitong}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

jwt:
  secret: ${JWT_SECRET:huizhitong-dev-jwt-secret-change-me-2026}
  expire-hours: 24

auth:
  admin-username: ${ADMIN_USERNAME:admin}
  admin-init-password: ${ADMIN_INIT_PASSWORD:admin123}