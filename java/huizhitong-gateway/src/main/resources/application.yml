server:
  port: 8080
spring:
  application:
    name: huizhitong-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/auth/**
        - id: tool-internal
          uri: ${TOOL_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/internal/**
          filters:
            - RewritePath=/api/internal/(?<segment>.*), /internal/${segment}
        - id: agent-service
          uri: ${AGENT_SERVICE_URI:http://localhost:8000}
          predicates:
            - Path=/api/agent/**
          filters:
            - RewritePath=/api/agent/(?<segment>.*), /internal/${segment}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
jwt:
  secret: ${JWT_SECRET:huizhitong-dev-jwt-secret-change-me-2026}