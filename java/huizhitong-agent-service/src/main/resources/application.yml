server:
  port: 8081

spring:
  application:
    name: huizhitong-agent-service
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/huizhitong?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

agent:
  runtime:
    url: ${AGENT_RUNTIME_URL:http://localhost:8000}

